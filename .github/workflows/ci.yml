name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep these versions in sync with .mise.toml.
env:
  RUBY_VERSION: "3.4.4"
  GO_VERSION: "1.25.14"
  JAVA_VERSION: "21"

jobs:
  spec:
    name: RSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rspec --exclude-pattern "spec/oracle/**/*_spec.rb"

  oracle:
    name: Lexer oracle (${{ matrix.oracle }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oracle: [go, java]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache oracle builds
        uses: actions/cache@v4
        with:
          path: tools/oracle/.cache
          key: oracle-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.JAVA_VERSION }}-${{ hashFiles('tools/oracle/setup', 'tools/oracle/go/**', 'tools/oracle/java/**') }}
      - name: Build oracles
        run: |
          if [ ! -x tools/oracle/.cache/bin/lexdump-go ]; then
            tools/oracle/setup
          fi
      - run: bundle exec rspec spec/oracle
        env:
          ORACLE: ${{ matrix.oracle }}
