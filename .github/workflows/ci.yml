name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep these versions in sync with .mise.toml.
env:
  RUBY_VERSION: "3.4.4"
  GO_VERSION: "1.25.14"
  JAVA_VERSION: "21"

jobs:
  spec:
    name: RSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      # The oracle specs read golden files, so they need neither Go nor Java.
      - run: bundle exec rspec
      - run: bundle exec rspec spec/oracle
        env:
          ORACLE: java

  oracle:
    name: Oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache oracle builds
        uses: actions/cache@v4
        with:
          path: tools/oracle/.cache
          key: oracle-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.JAVA_VERSION }}-${{ hashFiles('tools/oracle/setup', 'tools/oracle/go/**', 'tools/oracle/java/**') }}
      - name: Build oracles
        run: |
          if [ ! -x tools/oracle/.cache/bin/lexdump-go ] || [ ! -x tools/oracle/.cache/bin/parsedump-go ] || [ ! -x tools/oracle/.cache/bin/resolvedump-go ] || [ ! -x tools/oracle/.cache/bin/unicodeletters-go ]; then
            tools/oracle/setup
          fi
      - name: Check that the golden files are current
        run: |
          tools/oracle/golden
          git diff --exit-code spec/oracle/golden || {
            echo "The golden files are out of date. Run: mise run oracle:golden"
            exit 1
          }
      # A fixed seed keeps CI repeatable. Run `mise run fuzz` locally for random seeds.
      - name: Fuzz against Go
        run: tools/fuzz/fuzz --count 1000 --seed 1
