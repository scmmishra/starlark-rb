[tools]
ruby = "3.4.4"
# Go and Java run the oracles under tools/oracle. The gem does not need them.
go = "1.25.14"
java = "temurin-21.0.12+8.0.LTS"

[env]
_.path = ["./bin"]

[tasks.coverage]
description = "Run the full suite and measure line and branch coverage"
env = { COVERAGE = "1" }
run = "bundle exec rspec"

[tasks.fuzz]
description = "Compare our lexer and parser with Go on random inputs"
run = "tools/fuzz/fuzz"

[tasks."oracle:setup"]
description = "Download and build the Go and Java oracles"
run = "tools/oracle/setup"

[tasks."oracle:go"]
description = "Compare our lexer and parser against Go"
env = { ORACLE = "go" }
run = "bundle exec rspec spec/oracle"

[tasks."oracle:java"]
description = "Compare our lexer and parser against Java"
env = { ORACLE = "java" }
run = "bundle exec rspec spec/oracle"

[tasks."oracle:all"]
description = "Compare our lexer and parser against Go and Java"
env = { ORACLE = "all" }
run = "bundle exec rspec spec/oracle"
