[tools]
ruby = "3.4.4"
# Go and Java run the oracles under tools/oracle. The gem does not need them.
go = "1.25.14"
java = "temurin-21.0.12+8.0.LTS"

[env]
_.path = ["./bin"]

[tasks.coverage]
description = "Run the full suite and measure line and branch coverage"
env = { COVERAGE = "1" }
run = "bundle exec rspec"

[tasks.fuzz]
description = "Compare our lexer, parser, and resolver with Go on random inputs"
run = "tools/fuzz/fuzz"

[tasks.mutant]
description = "Mutation testing: find code changes that no test catches"
run = "bundle exec mutant run"

[tasks."oracle:setup"]
description = "Download and build the Go and Java oracles"
run = "tools/oracle/setup"

[tasks."oracle:golden"]
description = "Run the oracles on every spec input and rewrite spec/oracle/golden"
run = "tools/oracle/golden"

[tasks."oracle:go"]
description = "Compare our lexer, parser, and resolver with Go's golden output"
env = { ORACLE = "go" }
run = "bundle exec rspec spec/oracle"

[tasks."oracle:java"]
description = "Compare our lexer, parser, and resolver with Java's golden output"
env = { ORACLE = "java" }
run = "bundle exec rspec spec/oracle"

[tasks."oracle:live"]
description = "Compare with both oracles directly, without golden files"
env = { ORACLE = "all", ORACLE_LIVE = "1" }
run = "bundle exec rspec spec/oracle"
